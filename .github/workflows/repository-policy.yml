name: Repository Policy

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/repository-policy.yml"
      - ".github/workflows/windows-packages.yml"
      - "docs/book/**"
      - "docs/src/**"
      - "docs/superpowers/**"
      - "tools/check-repository-policy.rb"
      - "tools/check-windows-package-ci.rb"
      - "tools/prepare-windows-conda-release.ps1"
      - "tools/test-windows-conda-consumer.ps1"
      - "packaging/**"
      - "pixi.toml"
      - "pixi.lock"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/repository-policy.yml"
      - ".github/workflows/windows-packages.yml"
      - "docs/book/**"
      - "docs/src/**"
      - "docs/superpowers/**"
      - "tools/check-repository-policy.rb"
      - "tools/check-windows-package-ci.rb"
      - "tools/prepare-windows-conda-release.ps1"
      - "tools/test-windows-conda-consumer.ps1"
      - "packaging/**"
      - "pixi.toml"
      - "pixi.lock"
  workflow_dispatch:

jobs:
  policy:
    name: Repository Policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository policy
        run: |
          ruby tools/check-repository-policy.rb
          ruby tools/check-windows-package-ci.rb
