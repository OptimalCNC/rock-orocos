# Version-control definitions and overrides for the selected package layout.
#
# Packages declared by this root configuration need version_control entries.
# Packages imported from remote package sets use overrides.
#
version_control:
  - farbot:
    type: git
    url: https://github.com/OptimalCNC/farbot.git
    branch: master

  - rtlog-cpp:
    type: git
    url: https://github.com/OptimalCNC/rtlog-cpp.git
    branch: main

  - open62541:
    type: git
    url: https://github.com/open62541/open62541.git
    tag: v1.4.15

  - open62541pp:
    type: git
    url: https://github.com/open62541pp/open62541pp.git
    tag: v0.21.2

  - rtt_opcua:
    type: git
    url: https://github.com/OptimalCNC/rtt_opcua.git
    branch: dev

overrides:
  - rtt:
    type: git
    url: https://github.com/OptimalCNC/rtt.git
    branch: dev

  - ocl:
    type: git
    url: https://github.com/OptimalCNC/ocl.git
    branch: dev

  - orogen:
    type: git
    url: https://github.com/OptimalCNC/tools-orogen.git
    branch: dev

  - typelib:
    type: git
    url: https://github.com/OptimalCNC/tools-typelib.git
    branch: dev

  - utilmm:
    type: git
    url: https://github.com/OptimalCNC/utilmm.git
    branch: dev

  - rtt_typelib:
    type: git
    url: https://github.com/OptimalCNC/tools-rtt_typelib.git
    branch: dev
