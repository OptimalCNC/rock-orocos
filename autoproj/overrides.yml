# Version-control definitions and overrides for the selected package layout.
#
# Packages declared by this root configuration need version_control entries.
# Packages imported from remote package sets use overrides.
#
version_control:
  - farbot:
    type: git
    url: https://github.com/liufang-robot/farbot.git
    branch: master

  - rtlog-cpp:
    type: git
    url: https://github.com/liufang-robot/rtlog-cpp.git
    branch: main

  - open62541:
    type: git
    url: https://github.com/liufang-robot/open62541.git
    branch: master

  - open62541pp:
    type: git
    url: https://github.com/liufang-robot/open62541pp.git
    branch: master

  - rtt_opcua:
    type: git
    url: https://github.com/liufang-robot/rtt_opcua.git
    branch: dev

overrides:
  - rtt:
    type: git
    url: https://github.com/liufang-robot/rtt.git
    branch: dev

  - ocl:
    type: git
    url: https://github.com/liufang-robot/ocl.git
    branch: dev

  - orogen:
    type: git
    url: https://github.com/liufang-robot/tools-orogen.git
    branch: dev

  - typelib:
    type: git
    url: https://github.com/liufang-robot/tools-typelib.git
    branch: dev

  - utilmm:
    type: git
    url: https://github.com/liufang-robot/utilmm.git
    branch: dev

  - rtt_typelib:
    type: git
    url: https://github.com/liufang-robot/tools-rtt_typelib.git
    branch: dev
